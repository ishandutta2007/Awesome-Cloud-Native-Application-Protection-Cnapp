<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c1335" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(450px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbDrift {
        0%, 100% { transform: translate(0, 0); }
        33% { transform: translate(30px, -20px); }
        66% { transform: translate(-25px, 15px); }
      }
      .floating-orb { animation: orbDrift 14s ease-in-out infinite alternate; }
      .glowing-shield { animation: floatSlow 7s ease-in-out infinite; transform-origin: 1040px 210px; }
      .radar-sweep { transform-origin: 1040px 210px; animation: radarSweep 10s linear infinite; }
      .pulse-ring { animation: pulseGlow 4s ease-in-out infinite; transform-origin: 1040px 210px; }
      .scan-beam { animation: scanline 8s ease-in-out infinite; }
      .pill-card { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g class="floating-orb" opacity="0.6">
    <circle cx="150" cy="80" r="140" fill="#6366f1" filter="url(#heavyGlow)" opacity="0.25" />
    <circle cx="950" cy="320" r="160" fill="#00f2fe" filter="url(#heavyGlow)" opacity="0.2" />
    <circle cx="600" cy="40" r="120" fill="#a855f7" filter="url(#heavyGlow)" opacity="0.2" />
  </g>

  <!-- Background Dynamic Scanning Beam (Behind Text) -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" class="scan-beam" filter="url(#glow)" />
  </g>

  <!-- Dynamic Graphic Element Right Side: Cyber Shield & Radar -->
  <g id="radar-system">
    <!-- Concentric radar circles -->
    <circle cx="1040" cy="210" r="150" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" opacity="0.25" />
    <circle cx="1040" cy="210" r="110" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.3" class="pulse-ring" />
    <circle cx="1040" cy="210" r="70" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="2,4" opacity="0.4" />
    
    <!-- Rotating Radar Line -->
    <line x1="1040" y1="210" x2="1040" y2="70" stroke="url(#cyberCyan)" stroke-width="2.5" class="radar-sweep" filter="url(#glow)" opacity="0.8" />
    
    <!-- Animated CNAPP Shield Core -->
    <g class="glowing-shield">
      <!-- Shield Outer Aura -->
      <polygon points="1040,110 1120,150 1120,240 1040,300 960,240 960,150" fill="none" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)" opacity="0.9" />
      <polygon points="1040,125 1105,158 1105,232 1040,282 975,232 975,158" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
      
      <!-- Workload / Cloud Icons inside Shield -->
      <!-- Cloud symbol -->
      <path d="M 1020 205 A 15 15 0 0 1 1045 190 A 20 20 0 0 1 1070 205 A 12 12 0 0 1 1065 225 L 1020 225 A 12 12 0 0 1 1020 205 Z" fill="url(#cyberCyan)" opacity="0.9" filter="url(#glow)" />
      <!-- Lock / Keyhole -->
      <rect x="1035" y="215" width="10" height="18" rx="3" fill="#ffffff" />
      <circle cx="1040" cy="222" r="2" fill="#0f172a" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle & Badges (Completely clear, unblocked) -->
  <g transform="translate(60, 0)">
    <!-- Top Micro Tagline -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED CNAPP MATRIX</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
        Awesome <tspan fill="url(#cyberCyan)">CNAPP</tspan> Security
      </text>
    </g>

    <!-- Subtitle / Mission -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
        Cloud-Native Application Protection Platform: CSPM • CWPP • CIEM • Runtime • Attack Path Analysis
      </text>
      <text x="0" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
        Enterprise SaaS Market Leaders &amp; Production-Ready Open-Source Ecosystem
      </text>
    </g>

    <!-- Category Interactive Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: CSPM -->
      <g transform="translate(0, 0)" class="pill-card">
        <rect x="0" y="0" width="135" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" fill-opacity="0.8" />
        <circle cx="20" cy="19" r="4" fill="#38bdf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CSPM &amp; KSPM</text>
      </g>

      <!-- Pill 2: CWPP & Runtime -->
      <g transform="translate(147, 0)" class="pill-card">
        <rect x="0" y="0" width="150" height="38" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" fill-opacity="0.8" />
        <circle cx="20" cy="19" r="4" fill="#818cf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CWPP &amp; eBPF</text>
      </g>

      <!-- Pill 3: CIEM & Identity -->
      <g transform="translate(309, 0)" class="pill-card">
        <rect x="0" y="0" width="145" height="38" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" fill-opacity="0.8" />
        <circle cx="20" cy="19" r="4" fill="#c084fc" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CIEM &amp; Identity</text>
      </g>

      <!-- Pill 4: Shift-Left / IaC -->
      <g transform="translate(466, 0)" class="pill-card">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" fill-opacity="0.8" />
        <circle cx="20" cy="19" r="4" fill="#f472b6" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">IaC &amp; Attack Path</text>
      </g>
    </g>

    <!-- Stats & Live Tag -->
    <g transform="translate(0, 345)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        🛡️ <tspan fill="#38bdf8" font-weight="700">20+ Top Projects</tspan> • 🌟 <tspan fill="#e2e8f0" font-weight="700">140k+ Stars Indexed</tspan> • 💼 <tspan fill="#10b981" font-weight="700">Top 10 Enterprise SaaS</tspan>
      </text>
    </g>
  </g>

  <!-- Clean Border Stroke -->
  <rect width="1200" height="420" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />
</svg>