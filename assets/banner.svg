imation:floatSlow 7s ease-in-out infinite}.glowing-shield,.pulse-ring,.radar-sweep{transform-origin:1040px 210px}.radar-sweep{animation:radarSweep 10s linear infinite}.pulse-ring{animation:pulseGlow 4s ease-in-out infinite}.scan-beam{animation:scanline 8s ease-in-out infinite}.pill-card{transition:all .3s ease}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="floating-orb" opacity=".6"><circle cx="150" cy="80" r="140" fill="#6366f1" filter="url(#heavyGlow)" opacity=".25"/><circle cx="950" cy="320" r="160" fill="#00f2fe" filter="url(#heavyGlow)" opacity=".2"/><circle cx="600" cy="40" r="120" fill="#a855f7" filter="url(#heavyGlow)" opacity=".2"/></g><g opacity=".15"><line x1="0" x2="1200" y1="0" y2="0" stroke="#38bdf8" stroke-width="2" class="scan-beam" filter="url(#glow)"/></g><g id="radar-system"><circle cx="1040" cy="210" r="150" fill="none" stroke="#38bdf8" stroke-dasharray="4 8" stroke-width="1" opacity=".25"/><circle cx="1040" cy="210" r="110" fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="1.2" class="pulse-ring"/><circle cx="1040" cy="210" r="70" fill="none" stroke="#00f2fe" stroke-dasharray="2 4" stroke-width="1" opacity=".4"/><line x1="1040" x2="1040" y1="210" y2="70" stroke="url(#cyberCyan)" stroke-width="2.5" class="radar-sweep" filter="url(#glow)" opacity=".8"/><g class="glowing-shield"><polygon fill="none" stroke="url(#shieldGrad)" stroke-width="3" points="1040 110 1120 150 1120 240 1040 300 960 240 960 150" filter="url(#glow)" opacity=".9"/><polygon fill="#0f172a" fill-opacity=".7" stroke="#38bdf8" stroke-width="1" points="1040 125 1105 158 1105 232 1040 282 975 232 975 158" opacity=".8"/><path fill="url(#cyberCyan)" d="M 1020 205 A 15 15 0 0 1 1045 190 A 20 20 0 0 1 1070 205 A 12 12 0 0 1 1065 225 L 1020 225 A 12 12 0 0 1 1020 205 Z" filter="url(#glow)" opacity=".9"/><rect width="10" height="18" x="1035" y="215" fill="#fff" rx="3"/><circle cx="